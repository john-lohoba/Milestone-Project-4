{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'dashboard/css/dashboard.css' %}">
{% endblock %}
{% block content %}

<div class="container">
    <div class="row">
        <div class="col">
            <h1 class="dashboard-title">Run New Backtest</h1>
        </div>
    </div>
</div>

<div class="container dashboard-container mt-2">
    <div class="dashboard-header">
        <p class="dashboard-subtitle">Configure a strategy and submit a backtest job.</p>
    </div>

    <div class="dashboard-card form-card">

        <form action="{% url 'dashboard:backtest-post' %}" method="post" class="dashboard-form">
            {% csrf_token %}

            <div class="form-section">
                {{ form|crispy }}
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Run Backtest</button>
            </div>

        </form>
    </div>

</div>

{% endblock %}
{% block postloadjs %}
<script src="{% static 'dashboard/js/backtest_params.js' %}"></script>
{% endblock %}
