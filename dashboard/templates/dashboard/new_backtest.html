{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block content %}
{% url 'dashboard:backtest_post' as backtest_post_url %}


<div class="container text-center">
    <div class="row">
        <div class="col">
            <h2>Run Backtest</h2>
        </div>
    </div>
</div>

<div class="container text-center">
    <div class="row justify-content-center">
        <form action="{% url 'backtest-post' %}" method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit">Run</button>
        </form>
    </div>

</div>


{% endblock %}
{% block postloadjs %}
<script src="{% static 'dashboard/js/backtest_params.js' %}"></script>
{% endblock %}
